<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Survive – Astronaut Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050816; --panel:rgba(14,22,52,.82); --panel2:rgba(26,38,84,.9); --text:#e9eeff; --muted:#93a0d4;
    --accent:#35e0ff; --accent2:#ff7a3d; --good:#3ddc97; --warn:#ffc53d; --bad:#ff5d6c; --line:#25356f;
    --display:'Orbitron','Exo 2',system-ui,sans-serif; --body:'Exo 2',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);font-size:16px;color:var(--text);background:var(--bg);min-height:100vh}
  #stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
  main{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
  h1,h2,h3{font-family:var(--display);margin:0 0 8px;letter-spacing:.04em}
  h1{font-size:1.9rem;background:linear-gradient(90deg,var(--accent),#b28cff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:1.15rem;color:var(--accent)}
  h3{font-size:.95rem}
  .sub{color:var(--muted);margin:0 0 14px}
  .card{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 6px 28px rgba(0,0,0,.35)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  button,select,input[type=text]{font:inherit;color:var(--text)}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 14px rgba(53,224,255,.25);transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:linear-gradient(135deg,var(--accent),#6a8cff);color:#04101c;font-family:var(--display);font-weight:700;text-align:center;border:none;letter-spacing:.05em}
  button.sel{border-color:var(--accent);background:rgba(53,224,255,.14);box-shadow:0 0 0 1px var(--accent) inset}
  input[type=text],select{background:#0a1030;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  .dest{display:flex;flex-direction:column;gap:6px;padding:16px}
  .dest .emoji{font-size:2.6rem}
  .dest ul{margin:4px 0;padding-left:18px;color:var(--muted);font-size:.9rem}
  .tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;background:#0a1030;border:1px solid var(--line);color:var(--muted);margin-right:4px}
  .bars{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
  .bar{background:rgba(5,8,22,.7);border-radius:8px;padding:6px 8px;border:1px solid var(--line)}
  .bar .lbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
  .bar .lbl b{font-family:var(--display);color:var(--text);font-size:.8rem}
  .bar .track{height:8px;background:#16204a;border-radius:6px;margin-top:4px;overflow:hidden}
  .bar .fill{height:100%;transition:width .5s,background .5s;border-radius:6px}
  .hud{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
  .hud .num{font-family:var(--display);color:var(--accent)}
  .pips{display:inline-flex;gap:4px;vertical-align:middle}
  .pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
  .pip.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .prog{height:6px;background:#16204a;border-radius:4px;overflow:hidden;margin:6px 0 10px}
  .prog>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{padding:8px 12px;font-family:var(--display);font-size:.72rem;letter-spacing:.05em}
  .actions{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .actions button b{display:block}
  .actions button small{color:var(--muted)}
  .log{max-height:150px;overflow:auto;font-size:.86rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
  .log p{margin:3px 0}
  .fact{border-left:4px solid var(--accent);background:rgba(10,16,48,.85);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:.92rem}
  .fact b{color:var(--accent)}
  .choices{display:grid;gap:8px;margin-top:10px}
  .center{text-align:center}
  .big{font-size:3.2rem;margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .hidden{display:none}
  .tech{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  .tech.locked{opacity:.35}
  .tech .e{font-size:1.5rem}
  #sceneWrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 6px 28px rgba(0,0,0,.4)}
  #scene{display:block;width:100%;height:auto;background:#000}
  #map{position:relative;height:300px;border-radius:12px;border:1px solid var(--line);overflow:hidden;
    background:radial-gradient(circle at 50% 55%,rgba(53,224,255,.12),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 29px,rgba(53,224,255,.08) 29px 30px),
    repeating-linear-gradient(90deg,transparent 0 29px,rgba(53,224,255,.08) 29px 30px),#070d26}
  .site{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;padding:0;text-align:center;font-size:1.4rem;line-height:42px;background:#0e1a46}
  .site.done{border-color:var(--good)}
  .site.sel{box-shadow:0 0 18px var(--accent);border-color:var(--accent)}
  .hab{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-size:1.6rem;pointer-events:none}
  .lander-wrap{position:relative}
  #lc{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#02030a}
  .ctrl{display:flex;gap:12px;justify-content:center;margin-top:10px}
  .ctrl button{width:84px;height:60px;font-size:1.5rem;text-align:center;user-select:none;touch-action:none}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:rgba(5,8,22,.5)}
  .opt.on{border-color:var(--accent);background:rgba(53,224,255,.1)}
  .opt input{margin-top:4px}
  #toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(340px,90vw)}
  .toast{background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:.9rem;animation:pop .3s}
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .snd{position:fixed;top:10px;right:10px;padding:6px 10px;z-index:40;font-size:.85rem}
  .mapinfo{margin-top:10px}

  #eva{position:fixed;inset:0;z-index:100;background:#000;touch-action:none}
  #evaC{display:block;width:100%;height:100%}
  #evaHud{position:absolute;left:10px;top:10px;right:176px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
  .hb{background:rgba(5,8,22,.72);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.85rem;min-width:118px}
  .hb b{font-family:var(--display);font-size:.8rem;color:var(--accent)}
  .hb .track{height:7px;background:#16204a;border-radius:5px;margin-top:4px;overflow:hidden}
  .hb .fill{height:100%}
  #evaTop{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #evaMapC{width:150px;height:150px;border-radius:50%;box-shadow:0 0 18px rgba(53,224,255,.3)}
  #evaVig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.55) 100%)}
  #evaAlarm{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px 30px rgba(255,40,60,.75)}
  #evaFlash{position:absolute;inset:0;pointer-events:none;opacity:0;background:rgba(255,245,200,.85);transition:opacity 1.2s}
  #evaObj{position:absolute;left:10px;top:42%;pointer-events:none}
  #evaBanner{position:absolute;left:50%;top:112px;transform:translateX(-50%);pointer-events:none}
  #evaBanner .ban{font-family:var(--display);font-weight:700;letter-spacing:.08em;background:rgba(160,10,30,.88);border:1px solid #ff8a97;padding:8px 18px;border-radius:8px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.55}}
  #evaPrompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:flex;gap:8px;flex-direction:column;align-items:center;pointer-events:none}
  #evaBtns{position:absolute;right:14px;bottom:150px;display:none;flex-direction:column;gap:8px;z-index:2}
  .touch #evaBtns{display:flex}
  .touch #evaHint{display:none}
  .touch #evaObj{top:auto;bottom:210px}
  #evaCard{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:min(560px,92vw);pointer-events:none}
  #evaCard .fact{background:rgba(5,8,22,.9);margin:0;animation:pop .3s}
  #evaCross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid rgba(255,255,255,.55);border-radius:50%;pointer-events:none}
  #evaHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:.8rem;color:var(--muted);background:rgba(5,8,22,.6);padding:4px 10px;border-radius:8px;pointer-events:none;text-align:center;width:max-content;max-width:94vw}
  #evaOv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,4,14,.7);padding:12px;overflow:auto}
  #evaOv.hidden{display:none}
  #evaOv .card{max-width:620px;width:100%;margin:0}
  #joy{position:absolute;left:14px;bottom:70px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);display:none}
  #joyK{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(53,224,255,.55)}
  #lookZ{position:absolute;right:0;top:80px;bottom:60px;width:55%;display:none}
  #jumpB{position:absolute;right:16px;bottom:70px;width:70px;height:70px;border-radius:50%;text-align:center;display:none;font-size:1.6rem;padding:0;z-index:2}
  .touch #joy,.touch #lookZ,.touch #jumpB{display:block}
  .roster{font-size:.88rem}
  .peer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
  .peer .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .peer button{padding:3px 7px;font-size:.8rem}
  .modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:14px}
  .modes button{padding:16px}
  .modes button b{display:block;font-family:var(--display);margin-bottom:4px}
  @media(max-width:520px){h1{font-size:1.35rem}#map{height:260px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button class="snd" id="sndBtn" onclick="toggleSound()">🔇 Sound off</button>
<div id="toasts"></div>
<div id="eva" class="hidden">
  <canvas id="evaC"></canvas>
  <div id="evaVig"></div><div id="evaAlarm"></div><div id="evaFlash"></div>
  <div id="evaCross"></div>
  <div id="evaHud"></div>
  <div id="evaObj"></div>
  <div id="evaTop"><canvas id="evaMapC" width="150" height="150"></canvas><button id="evaBack" onclick="evaFinish('manual')">🏠 End shift (H)</button></div>
  <div id="evaBanner"></div>
  <div id="evaPrompt"></div>
  <div id="evaCard"></div>
  <div id="evaHint">WASD move · Shift sprint · Space jump · <b>F</b> scan · <b>E</b> use/repair · <b>Q</b> radio hint · H end shift</div>
  <div id="joy"><div id="joyK"></div></div><div id="lookZ"></div><button id="jumpB">⤒</button>
  <div id="evaBtns"><button id="bScan">🔎 Scan</button><button id="bUse">🛠 Use</button><button id="bRadio">📻 Hint</button></div>
  <div id="evaOv" class="hidden"></div>
</div>
<main>
  <h1>🚀 MISSION SURVIVE</h1>
  <p class="sub">Command a crewed mission. Land, build a base, explore, and learn why space exploration matters.</p>
  <div id="sceneWrap" class="hidden"><canvas id="scene" width="960" height="250"></canvas></div>
  <div id="app"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============ utilities ============ */
const $ = s => document.querySelector(s);
const app = $('#app');
const clamp = (v,a=0,b=100) => Math.max(a,Math.min(b,v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const rnd = (a,b) => a+Math.random()*(b-a);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* sound (WebAudio, off by default) */
let soundOn=false, actx=null;
function toggleSound(){
  soundOn=!soundOn; $('#sndBtn').textContent = soundOn?'🔊 Sound on':'🔇 Sound off';
  if(soundOn){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ soundOn=false; } beep(660,.08); }
}
function beep(f,d=.1,type='sine',vol=.05){
  if(!soundOn||!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=vol;
    o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.stop(actx.currentTime+d);
  }catch(e){}
}
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.innerHTML=msg;
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(),4200);
}

/* ============ background stars ============ */
(function(){
  const c=$('#stars'),x=c.getContext('2d'); let stars=[];
  function size(){c.width=innerWidth;c.height=innerHeight;
    stars=Array.from({length:150},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.2,s:Math.random()*.2+.04,p:Math.random()*6}));}
  function draw(t){
    x.fillStyle='#050816';x.fillRect(0,0,c.width,c.height);
    const g=x.createRadialGradient(c.width*.5,0,0,c.width*.5,0,c.height);
    g.addColorStop(0,'rgba(60,70,170,.35)');g.addColorStop(1,'rgba(5,8,22,0)');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
    for(const s of stars){
      s.y+=s.s; if(s.y>c.height){s.y=0;s.x=Math.random()*c.width}
      x.globalAlpha=.4+.6*Math.abs(Math.sin(t/800+s.p)); x.fillStyle='#fff';
      x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();
    }
    x.globalAlpha=1; requestAnimationFrame(draw);
  }
  addEventListener('resize',size);size();requestAnimationFrame(draw);
})();

/* ============ game data ============ */
const STATS = {
  oxygen:{label:'Oxygen',icon:'🫁'}, water:{label:'Water',icon:'💧'}, food:{label:'Food',icon:'🥫'},
  power:{label:'Power',icon:'⚡'}, health:{label:'Health',icon:'❤️'}, morale:{label:'Morale',icon:'🙂'}
};
const ICON = {oxygen:'🫁',water:'💧',food:'🥫',power:'⚡',health:'❤️',morale:'🙂',mat:'🧱',sci:'🔬'};

const DIFFS = {
  cadet:{name:'Cadet (easier)',drain:.8,risk:.8,event:.5},
  normal:{name:'Normal',drain:1,risk:1,event:.62},
  veteran:{name:'Veteran (hard)',drain:1.25,risk:1.25,event:.75}
};

const CREW = {
  engineer:{icon:'🛠️',name:'Engineer',desc:'Buildings cost 30% less. Power grid servicing +50%.'},
  geologist:{icon:'🪨',name:'Geologist',desc:'+40% science. Ice mining +30%.'},
  doctor:{icon:'🩺',name:'Flight Doctor',desc:'Healing +50%. Radiation damage −30%.'},
  botanist:{icon:'🌿',name:'Botanist',desc:'Greenhouse yield +50% and boosts morale.'}
};

const LOADOUT = [
  {id:'o2',icon:'🫁',name:'Spare oxygen tanks',cost:2,desc:'+15 starting oxygen'},
  {id:'h2o',icon:'💧',name:'Extra water tanks',cost:2,desc:'+15 starting water'},
  {id:'food',icon:'🥫',name:'Freeze-dried meals',cost:2,desc:'+15 starting food'},
  {id:'solar',icon:'🔋',name:'Extra battery pack',cost:2,desc:'+15 starting power'},
  {id:'shield',icon:'🛡️',name:'Radiation vest',cost:3,desc:'−25% radiation damage'},
  {id:'rover',icon:'🚙',name:'Pressurized rover',cost:3,desc:'−20% expedition risk'},
  {id:'med',icon:'💊',name:'Medical kit',cost:2,desc:'+10 starting health recovery on day 1 and +1 daily'},
  {id:'mats',icon:'🧱',name:'Prefab building kit',cost:2,desc:'+12 starting materials'}
];
const LOAD_BUDGET = 8;

const DESTS = {
  moon:{
    name:'The Moon', emoji:'🌕', days:12, diff:'Beginner', g:30,
    facts:['Gravity: 1/6 of Earth','No atmosphere','−170 °C to +120 °C','3 days away by rocket'],
    drain:{oxygen:6,water:4,food:4,power:4,morale:1}, solar:26, risk:.14,
    iceLine:'Water ice hides in permanently shadowed craters near the south pole.',
    intro:'You descend toward the lunar south pole, where Artemis-style missions plan their first base. No air, no weather — just razor dust, deep shadows and Earth hanging in the black sky.',
    science:'Moon rocks record 4.5 billion years of solar-system history.',
    sites:[
      {id:'shack',icon:'❄️',name:'Shackleton Crater Rim',x:18,y:28,cost:{power:12,oxygen:8},sci:14,water:25,mat:4,risk:.2,dmg:12,
       desc:'A crater whose floor never sees sunlight.',fact:'Shackleton crater near the lunar south pole has floors in permanent shadow, cold enough (−230 °C) to trap water ice for billions of years.'},
      {id:'apollo',icon:'🏁',name:'Apollo Heritage Site',x:78,y:26,cost:{power:10,oxygen:6},sci:10,morale:14,risk:.08,dmg:8,
       desc:'Visit footprints that have lasted decades.',fact:'Apollo footprints will last millions of years: with no wind or rain on the Moon, only micrometeorites slowly erode them.'},
      {id:'tube',icon:'🕳️',name:'Lava Tube Skylight',x:82,y:72,cost:{power:12,oxygen:8},sci:16,mat:12,risk:.3,dmg:15,
       desc:'A collapsed pit leading into a huge cave.',fact:'Lava tubes on the Moon could be kilometres wide — natural shelters from radiation, temperature swings and micrometeorites.'},
      {id:'high',icon:'⛰️',name:'Highlands Quarry',x:20,y:76,cost:{power:10,oxygen:6},sci:6,mat:16,risk:.12,dmg:9,
       desc:'Rich in aluminium, silicon and oxygen-bearing rock.',fact:'Lunar rock is about 43% oxygen by weight — locked in minerals. Future bases may extract it to breathe and make rocket fuel.'},
      {id:'far',icon:'📡',name:'Far-Side Radio Zone',x:50,y:12,cost:{power:14,oxygen:8},sci:20,risk:.18,dmg:10,
       desc:'Shielded from Earth\'s radio noise.',fact:'The Moon\'s far side blocks all radio from Earth, making it one of the quietest places in the solar system for radio astronomy.'}
    ]
  },
  mars:{
    name:'Mars', emoji:'🔴', days:16, diff:'Hard', g:60,
    facts:['Gravity: 38% of Earth','Air: 95% CO₂, 1% as thick','Avg −60 °C, global dust storms','6–9 months of travel'],
    drain:{oxygen:6,water:5,food:5,power:5,morale:2}, solar:20, risk:.2,
    iceLine:'Ice sits just under the surface at mid and high latitudes.',
    intro:'After seven months in transit your lander falls toward a rust-colored plain. A signal to Earth takes up to 22 minutes each way — you must decide for yourself.',
    science:'Ancient river deltas on Mars suggest it once held liquid water — and maybe life.',
    sites:[
      {id:'jez',icon:'🌾',name:'Jezero Delta',x:20,y:25,cost:{power:14,oxygen:8},sci:22,mat:4,risk:.22,dmg:12,
       desc:'A dried-up river delta that may preserve fossils.',fact:'Perseverance is exploring Jezero crater, a 3.5-billion-year-old lake bed. Delta sediments are among the best places to preserve signs of ancient life.'},
      {id:'ice',icon:'❄️',name:'Glacier Slope',x:78,y:20,cost:{power:12,oxygen:8},sci:6,water:30,risk:.15,dmg:10,
       desc:'A buried glacier at the base of a cliff.',fact:'Radar shows large buried ice deposits at Mars\' mid-latitudes — enough to supply future colonies with water and rocket fuel.'},
      {id:'oly',icon:'🌋',name:'Olympus Mons Foothills',x:84,y:70,cost:{power:16,oxygen:10},sci:12,mat:14,risk:.3,dmg:16,
       desc:'Base of the tallest volcano in the solar system.',fact:'Olympus Mons is about 22 km high — nearly three times the height of Mount Everest, and as wide as the state of Arizona.'},
      {id:'valles',icon:'🏜️',name:'Valles Marineris',x:24,y:75,cost:{power:15,oxygen:10},sci:18,mat:6,risk:.28,dmg:14,
       desc:'A canyon system as long as the USA is wide.',fact:'Valles Marineris stretches roughly 4,000 km and reaches 7 km deep. The Grand Canyon would fit in one of its side channels.'},
      {id:'dune',icon:'🌪️',name:'Dune Field',x:52,y:12,cost:{power:10,oxygen:6},sci:6,mat:10,risk:.2,dmg:8,
       desc:'Shifting sand. Watch your wheels.',fact:'Martian dunes move because of wind, even in air 100× thinner than Earth\'s. Rovers have gotten stuck in them before — Spirit was lost to a sand trap.'}

let G = null, scr = 'menu';
let setup = {name:'Commander', crew:'engineer', diff:'normal', load:new Set()};

function mods(){
  const t=G.tech, b=G.build, c=G.crew, l=G.load;
  return {
    risk: (t.has('suits')?.6:1) * (l.has('rover')?.8:1) * DIFFS[G.diff].risk,
    rad: (b.has('shelter')?.5:1) * (t.has('shield')?.7:1) * (l.has('shield')?.75:1) * (c==='doctor'?.7:1),
    sci: c==='geologist'?1.4:1,
    cost: c==='engineer'?.7:1,
    heal: c==='doctor'?1.5:1,
    farm: c==='botanist'?1.5:1,
    ap: 3 + (t.has('ai')?1:0)
  };
}

function newGame(key){
  const d = DESTS[key], l = setup.load;
  G = {key, d, name:setup.name.trim()||'Commander', crew:setup.crew, diff:setup.diff, load:new Set(l),
    day:0, ap:3, sci:0, spent:0, seen:new Set(), mat:l.has('mats')?12:0, over:false, event:null, tab:'actions', selSite:null,
    s:{oxygen:70+(l.has('o2')?15:0), water:65+(l.has('h2o')?15:0), food:65+(l.has('food')?15:0),
       power:70+(l.has('solar')?15:0), health:100, morale:80},
    tech:new Set(), build:new Set(), visited:new Set(), codex:new Map(), ach:new Set(),
    unlocked:new Set(), quizRight:0, quizTotal:0, lessons:new Set(), lesson:null, lStep:0, lRight:0, harvests:0, storm:0, landing:null,
    log:[], lastFact:null, rover:{x:0.62,target:0.62,t:0}};
  G.ap = mods().ap;
  scr='land'; render();
}

function applyDelta(delta, rad){
  const m=mods();
  for(const k in delta){
    let v=delta[k];
    if(k==='health' && v<0 && rad) v*=m.rad;
    if(k==='health' && v>0) v*=m.heal;
    G.s[k]=clamp(G.s[k]+v);
  }
}
function log(msg){ G.log.unshift(msg); }
function learn(fact){ if(!fact) return; G.lastFact=fact; if(!G.codex.has(fact)) G.codex.set(fact,G.day); }
function ach(id){
  if(G.ach.has(id)) return;
  G.ach.add(id); const a=ACHIEVEMENTS[id];
  toast(`🏆 Achievement: <b>${a.icon} ${a.name}</b>`); beep(880,.2,'triangle');
}
function addSci(n){
  G.sci += n;
  for(const s of SPINOFFS) if(G.sci>=s.at && !G.unlocked.has(s.name)){
    G.unlocked.add(s.name); log(`🎉 Discovery unlocked: ${s.icon} ${s.name}`); toast(`🎉 ${s.icon} <b>${s.name}</b> unlocked`);
  }
}

/* ============ render dispatcher ============ */
function render(){
  $('#sceneWrap').classList.toggle('hidden', scr!=='surface');
  if(scr!=='land') stopLander();
  if(scr==='menu') renderMenu();
  else if(scr==='mp') renderMP();
  else if(scr==='brief') renderBrief();
  else if(scr==='land') renderLand();
  else if(scr==='surface') renderSurface();
  else if(scr==='end') renderEnd();
  else if(scr==='exam') renderExam();
  if(MP.room) { mpSync(); }
}

    <p class="sub">Gravity here is <b>${({moon:1.62,mars:3.71,europa:1.31}[G.key]).toFixed(2)} m/s²</b>. Use the main engine (<b>↑ / Space</b>) and side thrusters (<b>← →</b>) to land gently on the <span style="color:var(--good)">green pad</span>. Slow down below the speed limit!</p>
    <div class="lander-wrap"><canvas id="lc" width="760" height="380"></canvas></div>
    <div class="ctrl">
      <button id="bL">◀</button><button id="bU">▲</button><button id="bR">▶</button>
    </div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <small class="sub" id="lhud"></small>
      <button onclick="finishLanding('assist')">🤖 Let autopilot land (rough)</button>
    </div>
  </div>`;
  const gx=d.g;
  const pts=[]; const N=40; let padI=Math.floor(rnd(8,N-10));
  for(let i=0;i<=N;i++){ pts.push(320+Math.sin(i*.7)*12+Math.sin(i*.31)*18+rnd(-4,4)); }
  for(let i=padI;i<padI+5;i++) pts[i]=335;
  L={x:rnd(120,640),y:30,vx:rnd(-25,25),vy:40,fuel:100,up:false,left:false,right:false,pts,N,padI,padW:5,done:false,g:gx,last:performance.now(),dust:[]};
  const bind=(id,k)=>{ const b=$('#'+id); const on=v=>e=>{e.preventDefault();L[k]=v;}; b.onpointerdown=on(true); b.onpointerup=on(false); b.onpointerleave=on(false); b.onpointercancel=on(false); };
  bind('bL','left'); bind('bU','up'); bind('bR','right');
  addEventListener('keydown',lKey); addEventListener('keyup',lKey);
  landRAF=requestAnimationFrame(landLoop);
}
function terrainY(x){
  const W=760, i=x/W*L.N, a=Math.floor(i), f=i-a;
  const p0=L.pts[clamp(a,0,L.N)], p1=L.pts[clamp(a+1,0,L.N)];
  return p0+(p1-p0)*f;
}
function landLoop(now){
  if(!L||scr!=='land') return;
  const dt=Math.min(.05,(now-L.last)/1000); L.last=now;
  const c=$('#lc'); if(!c) return; const x=c.getContext('2d');
  if(!L.done){
    L.vy += L.g*dt;
    if(L.up && L.fuel>0){ L.vy -= 110*dt; L.fuel-=14*dt; if(Math.random()<.6)L.dust.push({x:L.x,y:L.y+16,vx:rnd(-20,20),vy:rnd(40,100),l:.5}); }
    if(L.left && L.fuel>0){ L.vx -= 55*dt; L.fuel-=5*dt; }
    if(L.right && L.fuel>0){ L.vx += 55*dt; L.fuel-=5*dt; }
    L.fuel=Math.max(0,L.fuel);
    L.x+=L.vx*dt; L.y+=L.vy*dt;
    if(L.x<10){L.x=10;L.vx=Math.abs(L.vx)*.3} if(L.x>750){L.x=750;L.vx=-Math.abs(L.vx)*.3}
    const gy=terrainY(L.x);
    if(L.y+16>=gy){
      L.done=true; L.y=gy-16;
      const onPad = L.x>=L.padI/L.N*760 && L.x<=(L.padI+L.padW)/L.N*760;
      const sp=Math.abs(L.vy), hs=Math.abs(L.vx);
      let r;
      if(sp<30 && hs<22) r = onPad?'perfect':'offpad';
      else if(sp<70 && hs<45) r = onPad?'hard':'hardoff';
      else r='crash';
      setTimeout(()=>finishLanding(r),700);
    }
  }
  // draw
  x.clearRect(0,0,760,380);
  const sky = G.key==='mars' ? ['#7d3f26','#d9946a'] : ['#000208','#0b1130'];
  const gr=x.createLinearGradient(0,0,0,380); gr.addColorStop(0,sky[0]); gr.addColorStop(1,sky[1]); x.fillStyle=gr; x.fillRect(0,0,760,380);
  x.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<50;i++){ const sx=(i*137)%760, sy=(i*71)%240; if(G.key!=='mars') x.fillRect(sx,sy,1.5,1.5); }
  if(G.key==='europa'){ x.fillStyle='#d9a066'; x.beginPath(); x.arc(560,70,60,0,7); x.fill(); x.fillStyle='rgba(120,60,30,.5)'; x.fillRect(500,60,120,8); x.fillRect(505,80,110,6);}
  if(G.key==='moon'){ x.fillStyle='#3a7bd5'; x.beginPath(); x.arc(620,60,22,0,7); x.fill(); x.fillStyle='#fff8'; x.fillRect(606,56,18,4); }
  // terrain
  const gcol = G.key==='mars'?'#a8512c':G.key==='europa'?'#cfe3ee':'#8d8d95';
  x.fillStyle=gcol; x.beginPath(); x.moveTo(0,380);
  for(let i=0;i<=L.N;i++) x.lineTo(i/L.N*760,L.pts[i]); x.lineTo(760,380); x.closePath(); x.fill();
  const px0=L.padI/L.N*760, px1=(L.padI+L.padW)/L.N*760;
  x.fillStyle='#3ddc97'; x.fillRect(px0,L.pts[L.padI]-3,px1-px0,5);
  // dust
  for(const p of L.dust){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt; x.fillStyle=`rgba(255,200,120,${Math.max(0,p.l)})`; x.fillRect(p.x,p.y,3,3); }
  L.dust=L.dust.filter(p=>p.l>0);
  // lander
  x.save(); x.translate(L.x,L.y);
  const crashed = L.done && !(Math.abs(L.vy)<70);
  if(!crashed){
    x.fillStyle='#d6dcff'; x.beginPath(); x.moveTo(-12,-14); x.lineTo(12,-14); x.lineTo(16,8); x.lineTo(-16,8); x.closePath(); x.fill();
    x.fillStyle='#35e0ff'; x.beginPath(); x.arc(0,-6,5,0,7); x.fill();
    x.strokeStyle='#d6dcff'; x.lineWidth=3; x.beginPath(); x.moveTo(-14,8); x.lineTo(-22,16); x.moveTo(14,8); x.lineTo(22,16); x.stroke();
    if(L.up&&L.fuel>0&&!L.done){ x.fillStyle='#ffb347'; x.beginPath(); x.moveTo(-6,10); x.lineTo(6,10); x.lineTo(0,10+rnd(14,26)); x.fill(); }
    if(L.left&&L.fuel>0&&!L.done){ x.fillStyle='#ffb347'; x.fillRect(14,-4,rnd(8,14),4); }
    if(L.right&&L.fuel>0&&!L.done){ x.fillStyle='#ffb347'; x.fillRect(-14-rnd(8,14),-4,12,4); }
  } else { x.fillStyle='#ff5d6c'; x.fillRect(-14,-4,28,12); x.fillStyle='#ffb347'; x.beginPath(); x.arc(0,-4,16,0,7); x.fill(); }
  x.restore();
  // hud
  const sp=Math.abs(L.vy), ok=sp<30;
  const h=$('#lhud'); if(h) h.innerHTML = `Fall speed: <b style="color:${ok?'var(--good)':sp<70?'var(--warn)':'var(--bad)'}">${sp.toFixed(0)}</b> (safe &lt; 30) · Drift: <b>${Math.abs(L.vx).toFixed(0)}</b> · Fuel: <b>${L.fuel.toFixed(0)}%</b>`;
  landRAF=requestAnimationFrame(landLoop);
}
function finishLanding(r){
  if(G.landing) return; G.landing=r; stopLander();
  const R={
    perfect:{t:'🎯 Perfect landing! Everything is intact and you even salvage spare parts.',e:{},mat:8},
    offpad:{t:'✅ Soft landing, but off the pad — a long walk back to the cargo.',e:{power:-8,oxygen:-6}},
    hard:{t:'⚠ Hard landing on the pad. Some systems are shaken.',e:{health:-10,power:-8}},
    hardoff:{t:'⚠ Hard, off-target landing. Equipment is damaged.',e:{health:-14,power:-12,oxygen:-6}},
    crash:{t:'💥 Crash landing! The cabin held, but supplies and your health took a beating.',e:{health:-35,oxygen:-14,power:-18}},
    assist:{t:'🤖 Autopilot landed you — roughly. Systems shaken.',e:{health:-8,power:-8}}
  }[r];
  applyDelta(R.e); if(R.mat) G.mat+=R.mat;
  if(r==='perfect') ach('landing');
  G.day=1; G.ap=mods().ap;
  log(`🛬 Day 1: ${R.t}`); log(`📖 ${G.d.intro}`);
  learn(r==='perfect'?'Landing on another world is the riskiest part: Apollo 11\'s Eagle landed with seconds of fuel to spare after astronauts took manual control.':'Landers must brake from thousands of km/h to a walking pace. With no atmosphere on the Moon, only engines can slow the descent; Mars\'s thin air barely helps.');
  if(checkFail()) { return render(); }

}

/* science spending: separate wallet so discoveries (total) stay intact */
const sciSpendable = () => G.sci - G.spent;

function build(id){

  learn(id==='shelter'?'Burying habitats under regolith or ice can cut radiation exposure dramatically — a design planned for Moon and Mars bases.':id==='green'?'Closed-loop life support with plants is a key goal: crops make food, oxygen and clean water through transpiration.':null);

}
function research(id){
  const t=TECHS.find(x=>x.id===id);

/* ============ actions ============ */
function hazard(prob, dmg, rad, label){
  if(Math.random()<Math.min(.95,prob)){
    const d=Math.round(dmg*(rad?mods().rad:1));
    G.s.health=clamp(G.s.health-d); log(`😬 ${label} −${d} health.`); beep(180,.25,'sawtooth'); return true;
  }
  return false;
}
function doAction(id){
  const a=ACTIONS.find(x=>x.id===id), m=mods();
  if(!a||G.ap<=0||!can(a.cost)) return;
  G.ap--; for(const k in a.cost) G.s[k]=clamp(G.s[k]-a.cost[k]);
  const gain={...a.gain};
  if(a.botany && gain.food) gain.food=Math.round(gain.food*m.farm);
  if(a.botany && G.crew==='botanist') gain.morale=(gain.morale||0)+3;
  if(a.geo && G.crew==='geologist') gain.water=Math.round(gain.water*1.3);
  applyDelta(gain);
  if(a.special==='power') G.s.power=clamp(G.s.power+G.d.solar*(G.crew==='engineer'?1.5:1)*(G.storm>0?.4:1));
  if(a.mat) G.mat+=a.mat;
  const sc=Math.round(a.sci*m.sci); if(sc) addSci(sc);
  if(id==='farm'){ G.harvests++; if(G.harvests>=5) ach('greens'); }
  let msg=`${a.icon} ${a.name}.`; if(a.sci>=5) msg+=` +${sc} science.`; if(a.mat) msg+=` +${a.mat} materials.`;
  log(msg); beep(480,.07);
  if(a.risk) hazard(G.d.risk*m.risk, 6+Math.random()*10, G.key==='europa', 'Minor accident outside!');
  learn(a.fact);
  if(checkFail()) return render();
  render();
}
function doExpedition(id){
  const s=G.d.sites.find(x=>x.id===id), m=mods();
  if(!s||G.ap<2||!can(s.cost)) return;
  G.ap-=2; for(const k in s.cost) G.s[k]=clamp(G.s[k]-s.cost[k]);
  const first=!G.visited.has(id), f=first?1:.5;
  const hurt=hazard(s.risk*m.risk, s.dmg, s.rad, `Accident at ${s.name}!`);
  const sc=Math.round((s.sci||0)*m.sci*f); if(sc) addSci(sc);
  if(s.water) applyDelta({water:Math.round(s.water*f)});
  if(s.mat) G.mat+=Math.round(s.mat*f);
  if(s.morale) applyDelta({morale:Math.round(s.morale*f)});
  G.visited.add(id);
  log(`🚙 Expedition to ${s.name}${hurt?' (rough trip)':''}: ${[sc?`+${sc}🔬`:'',s.water?`+${Math.round(s.water*f)}💧`:'',s.mat?`+${Math.round(s.mat*f)}🧱`:''].filter(Boolean).join(' ')}.`);
  G.rover.target = 0.1+Math.random()*0.8; G.rover.t=performance.now();
  setTimeout(()=>{ G.rover.target=0.62; },2800);
  ach('first'); if(G.d.sites.every(x=>G.visited.has(x.id))) ach('explorer');
  learn(s.fact); beep(560,.1,'triangle');
  if(checkFail()) return render();
  render();
}

/* ============ day cycle ============ */
function endDay(){
  const d=G.d, df=DIFFS[G.diff], t=G.tech;
  const dr=d.drain; let note=`🌙 End of day ${G.day}.`;
  const red={water:t.has('recycler')?2:0, power:t.has('battery')?2:0, food:t.has('nutri')?2:0};
  for(const k in dr) G.s[k]=clamp(G.s[k]-Math.max(1,Math.round(dr[k]*df.drain)-(red[k]||0)));
  // buildings
  const b=G.build, sunny=G.storm>0?.4:1;
  if(b.has('solar')) G.s.power=clamp(G.s.power+Math.round(d.solar*.35*sunny));
  if(b.has('drill')){ G.s.water=clamp(G.s.water+9); G.s.power=clamp(G.s.power-2); }
  if(b.has('oxy') && G.s.power>=3 && G.s.water>=2){ G.s.oxygen=clamp(G.s.oxygen+8); G.s.power-=3; G.s.water-=2; }
  if(b.has('green') && G.s.water>=2){ G.s.food=clamp(G.s.food+7); G.s.water-=2; G.s.morale=clamp(G.s.morale+1); }
  if(b.has('rec')) G.s.morale=clamp(G.s.morale+3);
  if(b.has('comm')) addSci(3);
  if(G.load.has('med')) applyDelta({health:1});
  if(G.storm>0) G.storm--;
  if(G.s.power<=0){ applyDelta({oxygen:-14,health:-6}); note+=' ⚠ Power outage: life support failing!'; }
  if(G.s.morale<20){ applyDelta({health:-4}); note+=' 😟 Low morale hurts your health.'; }
  if(G.s.oxygen<15||G.s.water<15||G.s.food<15){ applyDelta({health:-6}); note+=' Shortages hurt your health.'; }
  applyDelta({health:2});
  log(note);
  if(checkFail()) return render();
  if(G.day>=d.days){ G.over=true; G.win=true; ach('survivor'); scr='end'; return render(); }
  G.day++; G.ap=mods().ap;
  log(`☀️ Day ${G.day} begins.`);
  const roll=Math.random();
  if(roll<df.event){
    const pool=EVENTS.all.concat(EVENTS[G.key]);
    const fresh=pool.filter(e=>!G.seen.has(e.title));
    const e=pick(fresh.length?fresh:pool); G.seen.add(e.title);
    G.event={type:'event',...e}; beep(300,.2,'square');
  } else if(roll<df.event+.3){
    const q=pick(QUIZ), opts=shuffle([{t:q.a,correct:true},...q.w.map(t=>({t,correct:false}))]);
    G.event={type:'quiz',title:'📡 Mission Control Quiz',text:q.q,choices:opts,fact:q.why};
  } else if(Math.random()<.5) learn(pick(GENERAL_FACTS));
  render();
}
function chooseEvent(i){
  const e=G.event, c=e.choices[i];
  if(e.type==='quiz'){
    G.quizTotal++;
    if(c.correct){ G.quizRight++; applyDelta({morale:8}); addSci(5); log('📡 Quiz: correct! +5 science, +8 morale.'); toast('✅ Correct! +5🔬'); beep(900,.2,'triangle'); if(G.quizRight>=4) ach('scholar'); }
    else { log('📡 Quiz: not quite — mission control explains the answer.'); toast('❌ Not quite.'); beep(200,.25,'sawtooth'); }
    learn(e.fact);
  } else {
    applyDelta(c.e||{}, c.rad);
    if(c.sci) addSci(Math.round(c.sci*mods().sci));
    if(c.storm) G.storm=c.storm; if(e.storm && !c.storm) G.storm=e.storm;
    log(`⚠ ${e.title}: ${c.res}`); learn(e.fact);
  }
  G.event=null;
  if(checkFail()) return render();
  render();
}
function renderEvent(){
  const e=G.event, q=e.type==='quiz';
  return `<div class="card" style="border-color:${q?'var(--accent)':'var(--warn)'}">
    <h2 style="color:${q?'var(--accent)':'var(--warn)'}">${e.title}</h2><p>${e.text}</p>
    <div class="choices">${e.choices.map((c,i)=>`<button onclick="chooseEvent(${i})">${c.t}</button>`).join('')}</div></div>`;
}

function checkFail(){
  const reasons={
    oxygen:'You ran out of breathable oxygen. In space, air is life — production and recycling must outpace use.',
    water:'Dehydration ended the mission. Water is heavy to launch, so astronauts recycle it and mine local ice.',
    food:'The crew starved. Long missions need food production because resupply may be months away.',
    health:'The crew became too ill to continue. Radiation, injuries and bone and muscle loss are serious hazards.'
  };
  for(const k in reasons) if(G.s[k]<=0){ G.over=true; G.win=false; G.reason=reasons[k]; scr='end'; return true; }
  return false;
}

const wname = k => ({moon:'Moon',mars:'Mars',europa:'Europa'}[k]||k);

function mpSync(){

async function mpJoin(){
  const code=($('#mpCode').value||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);
  const name=(($('#mpName').value||'').trim()||'Astronaut').slice(0,16);

    const room = (window.claude && claude.use) ? await claude.use('room') : null;
    if(!room){ MP.msg='Multiplayer is not available in this view. Open the shared artifact link while signed in (a plain saved file cannot connect).'; return renderMP(); }
    const nr = await room.join('crew-'+code);
    MP.room=nr; MP.code=code; MP.msg='';
    MP.unsubs.push(nr.onPeers(()=>updateRoster()));
    MP.unsubs.push(nr.on('help',onHelp));
    MP.unsubs.push(nr.on('sample',onTeamSample));
    MP.unsubs.push(nr.on('fix',onFix));
    mpSync(); renderMP();
  }catch(e){ MP.msg='Could not join: '+(e&&e.message||'unknown error'); MP.room=null; renderMP(); }
}
function mpLeave(){
  MP.unsubs.forEach(u=>{try{u()}catch(e){}}); MP.unsubs=[];

  MP.room=null; MP.code=''; renderMP();
}
function updateRoster(){ const el=document.getElementById('roster'); if(el) el.innerHTML=rosterHTML(); }
function rosterHTML(){
  if(!MP.room) return '';

    const pr=p.presence||{}, mine=p.peer===me, w=DESTS[pr.world];
    const where = pr.mode==='eva'?'🥽 on EVA':pr.mode==='base'&&w?`${w.emoji} ${wname(pr.world)} · day ${Number(pr.day)||'?'}`:'🛰️ in lobby';
    const stat = pr.mode==='base'?` · ❤️ ${Number(pr.hp)||0} · 🔬 ${Number(pr.sci)||0}${pr.lowv<35?` · ⚠ ${esc(STATS[pr.low]?STATS[pr.low].label:'')} low`:''}`:'';
    const btns = (!mine&&canHelp&&pr.mode==='base') ? ['water','oxygen','food','power'].map(r=>`<button title="Send 10 ${r}" onclick="sendHelp('${safeId(p.peer)}','${r}')">${STATS[r].icon}</button>`).join('') : '';

  }).join('');

}
function sendHelp(peerId,res){
  if(!MP.room||!G||G.over||!['oxygen','water','food','power'].includes(res)) return;
  if(G.s[res]<35){ toast('Keep at least 35 for yourself first!'); return; }
  G.s[res]=clamp(G.s[res]-10);
  MP.room.emit('help',{to:peerId,res,amt:10,from:MP.name}).catch(()=>{});
  log(`🤝 You sent 10 ${STATS[res].icon} to a crewmate.`); toast(`🤝 Sent 10 ${STATS[res].icon}`); ach('team'); learn('Real crews share resources: on the ISS, astronauts from many countries pool supplies and rely on each other for safety.');
  render();
}
function onHelp(m){
  if(m.sameTab||!m.data||m.data.to!==myPeerId()) return;
  const res=m.data.res; if(!['oxygen','water','food','power'].includes(res)) return;
  const now=Date.now(); if(MP.lastHelp[m.peer]&&now-MP.lastHelp[m.peer]<1500) return; MP.lastHelp[m.peer]=now;
  if(G&&!G.over&&scr==='surface'){

  }
}
function onTeamSample(m){

  const jd=e=>{ e.preventDefault(); joyId=e.pointerId; const r=joy.getBoundingClientRect(); jx0=r.left+r.width/2; jy0=r.top+r.height/2; jm(e); try{joy.setPointerCapture(e.pointerId)}catch(_){} };
  const ju=e=>{ if(e.pointerId!==joyId) return; joyId=null; if(E){E.joy.x=0;E.joy.y=0;} knob.style.left='40px'; knob.style.top='40px'; };
  joy.addEventListener('pointerdown',jd); joy.addEventListener('pointermove',jm); joy.addEventListener('pointerup',ju); joy.addEventListener('pointercancel',ju);
  look.addEventListener('pointerdown',e=>{ e.preventDefault(); lookId=e.pointerId; lx=e.clientX; ly=e.clientY; try{look.setPointerCapture(e.pointerId)}catch(_){} });
  look.addEventListener('pointermove',e=>{ if(e.pointerId!==lookId||!E||E.paused) return; E.yaw-=(e.clientX-lx)*.005; E.pitch=clamp(E.pitch-(e.clientY-ly)*.005,-1.4,1.4); lx=e.clientX; ly=e.clientY; });
  const lu=e=>{ if(e.pointerId===lookId) lookId=null; }; look.addEventListener('pointerup',lu); look.addEventListener('pointercancel',lu);

/* ---- scanner & interaction ---- */
function evaTargets(){
  const t=[...E.modules,...E.panels]; if(E.crew) t.push(E.crew); return t;
}
function evaCamDir(){ const cp=Math.cos(E.pitch); return new THREE.Vector3(-Math.sin(E.yaw)*cp,Math.sin(E.pitch),-Math.cos(E.yaw)*cp); }
function evaFindTarget(maxD,cone){
  const cp=E.camera.position, f=evaCamDir(); let best=null,bs=-1;
  for(const t of evaTargets()){ const v=new THREE.Vector3().subVectors(t.pos,cp), dist=v.length()-t.r*.6; if(dist>maxD) continue;
    const dot=v.normalize().dot(f); const need=dist<8?Math.min(cone,.6):cone; if(dot<need) continue;
    const sc=dot-dist*.004; if(sc>bs){bs=sc;best=t;} }
  return best;
}
function scanText(t){
  const em=E.em;
  if(t.kind==='module'){
    const leaking=em&&em.type==='leak'&&!em.solved&&t.leak;
    const p=leaking?64:101;
    return {text:`📟 <b>${t.name}</b>: pressure <b>${leaking?p+' kPa ▼ falling':'101 kPa ✓'}</b> (normal 101) · temp ${leaking?'−4 °C, cooling':'21 °C'} · ${leaking?'<span style="color:var(--bad)">ANOMALY: air escaping</span>':'nominal'}`,anomaly:leaking};
  }
  if(t.kind==='panel'){
    const bad=em&&em.type==='power'&&!em.solved&&t.bad;
    if(!bad) return {text:`📟 <b>${t.name}</b>: output <b>4.2 kW ✓</b> · current 18.1 A · surface clean · nominal`,anomaly:false};
    const c=t.bad;
    const txt={dust:`output <b>0.6 kW ▼</b> · voltage normal · current normal but tiny · surface transmittance <b>14%</b> (heavy dust layer)`,
               cable:`output <b>0 kW ▼</b> · panel voltage normal (36 V) · <b>no current at connector J2</b> · surface clean`,
               crack:`output <b>1.1 kW ▼</b> · cell 3 reverse-biased, hot spot · <b>visible fracture across the glass</b> · surface otherwise clean`}[c];
    return {text:`📟 <b>${t.name}</b>: ${txt}<br><span style="color:var(--bad)">ANOMALY: this panel is faulty</span>`,anomaly:true};
  }
  if(t.kind==='crew'){
    const c=t.cond;
    const txt={hypoxia:`SpO₂ <b>74% ▼</b> · breathing fast &amp; shallow · confused, slurred speech · suit O₂ gauge: <b>EMPTY</b> · skin pale/blue lips`,
               heat:`core temperature <b>39.8 °C ▲</b> · skin hot and flushed · <b>stopped sweating</b> · suit cooling loop: <b>FAILED</b> · SpO₂ 97%`}[c];
    return {text:`📟 <b>${t.name}</b>: ${txt}`,anomaly:true};
  }

}
function evaScan(){
  if(!E||E.done) return;

  const r=scanText(t); beep(1000,.08,'triangle'); evaToast(r.text);
  E.scan={id:t.id,at:E.elapsed};
  const em=E.em;
  if(em&&!em.solved&&r.anomaly&&!em.identified){
    if((em.type==='leak'&&t.kind==='module')||(em.type==='power'&&t.kind==='panel')||(em.type==='medical'&&t.kind==='crew')){
      em.identified=true; em.stage='tool'; addScore(60,'problem identified'); radio(em.type==='leak'?`Confirmed: ${t.name} is leaking. Get to it and press <b>E</b> to choose a repair.`:em.type==='power'?`Confirmed: ${t.name} is the faulty panel. Press <b>E</b> next to it and pick the right fix.`:`Vitals logged. Press <b>E</b> next to your crewmate and give the right first aid.`);
    }
  } else if(em&&!em.solved&&!r.anomaly&&((em.type==='leak'&&t.kind==='module')||(em.type==='power'&&t.kind==='panel'))){

}
function evaUse(){

  if(dist>5.5){ evaToast(`🛠 Get closer to <b>${t.name}</b> to work on it.`); return; }
  if(!em||em.solved||!['leak','power','medical'].includes(em.type)){ evaToast(`✅ ${t.name}: nothing wrong here.`); return; }
  const relevant=(em.type==='leak'&&t.kind==='module'&&t.leak)||(em.type==='power'&&t.kind==='panel'&&t.bad)||(em.type==='medical'&&t.kind==='crew');

function toolsFor(em,t){

    {n:'Pump in extra oxygen and keep working',ok:false,why:'Adding air only delays the problem: it escapes as fast as you add it, and you waste your oxygen supply.'},
    {n:'Cover the hole with ordinary duct tape',ok:false,why:'Ordinary tape cannot hold a pressure difference for long and fails in extreme cold. You need a rated patch.'},
    {n:'Open the airlock to equalize the pressure',ok:false,why:'Opening an airlock to vacuum would vent MORE air. Never do that.'}];
  if(em.type==='power'){ const c=t.bad; return [
    {n:'Brush and blow the dust off the panel',ok:c==='dust',why:c==='dust'?'Correct. Heavy dust blocked sunlight (14% transmittance). Cleaning restores output.':'Dust is not the problem here. Re-read the scan: the surface was not dusty.'},
    {n:'Reconnect the cable at connector J2',ok:c==='cable',why:c==='cable'?'Correct. The panel made normal voltage but no current flowed: a disconnected cable.':'The cable is fine. Re-read the scan: current was still flowing.'},
    {n:'Swap in a spare panel',ok:c==='crack',why:c==='crack'?'Correct. A fractured panel with a hot spot cannot be cleaned or reconnected: it must be replaced.':'This panel is not broken. Replacing it would waste time and spares.'},
    {n:'Restart the habitat computer',ok:false,why:'A reboot cannot fix a physical fault in a panel or cable.'}]; }
  if(em.type==='medical'){ const c=t.cond; return [
    {n:'Connect a spare oxygen line to their suit',ok:c==='hypoxia',why:c==='hypoxia'?'Correct. Empty suit oxygen + blue lips + confusion = hypoxia. Restoring oxygen is the fix.':'Their oxygen is fine (SpO₂ 97%). The real problem is overheating.'},
    {n:'Move them to shade, restore cooling and give water',ok:c==='heat',why:c==='heat'?'Correct. A failed cooling loop and 39.8 °C means heat exhaustion: cool them down.':'They are not overheating. Their oxygen is the problem.'},
    {n:'Take off their helmet so they can breathe',ok:false,severe:true,why:'DANGEROUS! Never open a helmet outside: you would lose pressure and air instantly.'},
    {n:'Give them pain medication and wait',ok:false,why:'Medication does not treat low oxygen or overheating. Find the actual cause.'}]; }
  return [];
}
function openTools(t){

/* ---- main loop ---- */
function evaFrame(t){
  if(!E) return; E.raf=requestAnimationFrame(evaFrame);
  const dt=Math.min(.05,(t-E.last)/1000); E.last=t;
  if(!E.paused&&!E.done) evaUpdate(dt,t);
  E.renderer.render(E.scene,E.camera);
}
function evaUpdate(dt,t){
  const K=E.keys; E.elapsed+=dt;
  // movement

  let sx=(K['d']?1:0)-(K['a']?1:0)+E.joy.x;
  if(K['arrowleft']) E.yaw+=1.8*dt; if(K['arrowright']) E.yaw-=1.8*dt;
  const m=Math.hypot(fx,sx); if(m>1){fx/=m;sx/=m;}
  const sp=(K['shift']?8:4.8);
  const sinY=Math.sin(E.yaw), cosY=Math.cos(E.yaw);
  let nx=E.px+(-sinY*fx+cosY*sx)*sp*dt, nz=E.pz+(-cosY*fx-sinY*sx)*sp*dt;
  const r=Math.hypot(nx,nz); if(r>118){ nx*=118/r; nz*=118/r; }
  for(const s of E.solids){ const dx=nx-s.x, dz=nz-s.z, dd=Math.hypot(dx,dz); if(dd<s.r){ const k=s.r/Math.max(dd,.01); nx=s.x+dx*k; nz=s.z+dz*k; } }

    const sky = k==='mars'?['#7a3b24','#e0a275']: k==='europa'?['#000105','#0a1020']:['#000104','#070a16'];
    const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,sky[0]); g.addColorStop(1,sky[1]); x.fillStyle=g; x.fillRect(0,0,W,H);
    if(k!=='mars'){ x.fillStyle='#fff'; for(let i=0;i<70;i++){ x.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+i)); x.fillRect((i*131)%W,(i*53)%150,1.5,1.5);} x.globalAlpha=1; }
    // celestial bodies
    if(k==='moon'){ x.fillStyle='#3a7bd5'; x.beginPath(); x.arc(780,60,24,0,7); x.fill(); x.fillStyle='rgba(255,255,255,.6)'; x.fillRect(764,54,22,4); x.fillStyle='#2f9e5a'; x.fillRect(772,66,10,6); }
    if(k==='europa'){
      x.save(); x.beginPath(); x.arc(700,70,95,0,7); x.clip();
      const cols=['#d9a066','#b9763f','#e8c9a0','#a1612f','#d9a066'];
      cols.forEach((cc,i)=>{ x.fillStyle=cc; x.fillRect(600,-25+i*38,200,38); });
      x.fillStyle='rgba(200,60,40,.6)'; x.beginPath(); x.ellipse(720,100,22,12,0,0,7); x.fill(); x.restore();
    }
    // sun
    const sx=((t/60000)%1)*(W+160)-80, sy=60+Math.abs(Math.sin(sx*.004))*-30+40;
    x.fillStyle=k==='europa'?'#fff7e0':'#fff3c8'; x.beginPath(); x.arc(sx,k==='mars'?70:sy,k==='europa'?5:k==='mars'?13:10,0,7); x.fill();
    // far hills
    x.fillStyle=k==='mars'?'#8b4426':k==='europa'?'#a6bfd0':'#5f5f68';
    x.beginPath(); x.moveTo(0,H); for(let px=0;px<=W;px+=20) x.lineTo(px,150+Math.sin(px*.011+2)*20+Math.sin(px*.03)*6); x.lineTo(W,H); x.fill();
    // ground
    x.fillStyle=k==='mars'?'#a8512c':k==='europa'?'#d3e6f0':'#8d8d95';
    x.beginPath(); x.moveTo(0,H); for(let px=0;px<=W;px+=10) x.lineTo(px,gy(px)); x.lineTo(W,H); x.fill();
    x.fillStyle='rgba(0,0,0,.18)'; craters.forEach(c2=>{ x.beginPath(); x.ellipse(c2.x,gy(c2.x)+10,c2.w,6,0,0,7); x.fill(); });
    // habitat
    const bx=290, by=gy(bx);
    const lit = G.s.power>15;
    x.fillStyle='#cfd6f5'; x.beginPath(); x.arc(bx,by,52,Math.PI,0); x.fill();
    x.fillStyle='#9aa6d6'; x.fillRect(bx-52,by-4,104,8);
    x.fillStyle=lit?'#ffe28a':'#2a3156'; x.beginPath(); x.arc(bx-18,by-24,8,0,7); x.fill(); x.beginPath(); x.arc(bx+18,by-24,8,0,7); x.fill();
    x.fillStyle='#5a6aa8'; x.fillRect(bx-9,by-26,18,26);
    x.strokeStyle='#cfd6f5'; x.lineWidth=2; x.beginPath(); x.moveTo(bx,by-52); x.lineTo(bx,by-72); x.stroke();
    x.fillStyle=lit&&Math.floor(t/500)%2?'#ff5d6c':'#702030'; x.beginPath(); x.arc(bx,by-72,3,0,7); x.fill();
    // buildings
    let ox=bx+90;
    const draw={
      solar:(px,py)=>{ x.fillStyle='#2b4aa8'; x.save(); x.translate(px,py-18); x.rotate(-.35); x.fillRect(-22,-6,44,12); x.restore(); x.fillStyle='#ccc'; x.fillRect(px-1,py-18,2,18); },
      drill:(px,py)=>{ x.fillStyle='#b0b7d8'; x.fillRect(px-6,py-40,12,40); x.fillStyle='#35e0ff'; x.fillRect(px-14,py-8,28,8); },
      oxy:(px,py)=>{ x.fillStyle='#8ecbff'; x.fillRect(px-14,py-28,28,28); x.fillStyle='#fff'; x.fillRect(px-8,py-22,16,5); },
      green:(px,py)=>{ x.fillStyle='rgba(61,220,151,.75)'; x.beginPath(); x.arc(px,py,26,Math.PI,0); x.fill(); x.fillStyle='#1d7a4f'; x.fillRect(px-14,py-10,6,10); x.fillRect(px+4,py-14,6,14); },
      shelter:(px,py)=>{ x.fillStyle='#6a7090'; x.fillRect(px-22,py-24,44,24); x.fillStyle='#4a5070'; x.fillRect(px-22,py-30,44,6); },
      rec:(px,py)=>{ x.fillStyle='#c78fff'; x.beginPath(); x.arc(px,py,18,Math.PI,0); x.fill(); },
      comm:(px,py)=>{ x.strokeStyle='#ddd'; x.lineWidth=2; x.beginPath(); x.moveTo(px,py); x.lineTo(px,py-22); x.stroke(); x.fillStyle='#ddd'; x.beginPath(); x.ellipse(px,py-26,16,6,-.4,0,7); x.fill(); }
    };
    BUILDINGS.forEach(b=>{ if(G.build.has(b.id)){ draw[b.id](ox,gy(ox)); ox+=Math.max(52,b.id==='green'?62:52); } });
    // rover
    const r=G.rover; r.x+=(r.target-r.x)*.02;
    const rx=r.x*W, ry=gy(rx), moving=Math.abs(r.target-r.x)>.004;
    x.fillStyle='#e8edff'; x.fillRect(rx-18,ry-18+(moving?Math.sin(t/60)*1:0),36,12);
    x.fillStyle='#35e0ff'; x.fillRect(rx+6,ry-26,10,8);
    x.fillStyle='#222'; [-12,12].forEach(o=>{ x.beginPath(); x.arc(rx+o,ry-4,6,0,7); x.fill(); });
    // astronaut
    const ax=bx+62+(moving?0:Math.sin(t/1500)*10), ay=gy(ax);
    x.fillStyle='#fff'; x.fillRect(ax-5,ay-26,10,18); x.beginPath(); x.arc(ax,ay-30,7,0,7); x.fill();
    x.fillStyle='#35e0ff'; x.beginPath(); x.arc(ax+1,ay-30,4,0,7); x.fill();
    x.fillStyle='#fff'; x.fillRect(ax-5,ay-8,4,8); x.fillRect(ax+1,ay-8,4,8);
    // particles
    if(storm || k==='mars'){
      x.fillStyle=storm?'rgba(230,150,90,.5)':'rgba(230,170,120,.12)';
      dust.forEach(p=>{ p.x-=p.v*(storm?3:.6); if(p.x<0){p.x=W;p.y=Math.random()*H} x.fillRect(p.x,p.y,p.s*(storm?4:2),p.s*.6); });
      if(storm){ x.fillStyle='rgba(190,110,60,.35)'; x.fillRect(0,0,W,H); }
    }
    // power-out darkness
    if(G.s.power<=0){ x.fillStyle='rgba(0,0,10,.45)'; x.fillRect(0,0,W,H); }
  }
  requestAnimationFrame(frame);
})();

render();
</script>
</body>
</html>
